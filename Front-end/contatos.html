<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Volt Drive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- MENU -->
        <nav class="menu">

            <a href="#">Volt Drive</a>
            <a href="#">Inicio</a>
            <a href="#">Modelos</a>
            <a href="#">Contatos</a>
            <a href="#">Carrinho</a>

        </nav>


        <!-- CONTEÚDO -->
        <section class="conteudo">

            <!-- LADO ESQUERDO -->
            <div class="lado-esquerdo">

                <div class="item">
                    <span>Fale com a Volt Drive</span>
                </div>

                <div class="item">
                    <span>Sobre a Empresa</span>
                </div>

                <div class="item">
                    <span>Telefone</span>
                </div>

                <div class="item">
                    <span>Email</span>
                </div>

                <div class="item">
                    <span>Endereço</span>
                </div>

                <div class="item">
                    <span>Horário de Atendimento</span>
                </div>

            </div>


            <!-- LADO DIREITO -->
            <div class="lado-direito">

                <form>

                    <label>Nome Completo:</label>
                    <input type="text" placeholder="Escreva">


                    <label>Email:</label>
                    <input type="email" placeholder="Escreva">


                    <label>Telefone:</label>
                    <input type="text" placeholder="Escreva">


                    <label>Assunto:</label>
                    <select>
                        <option>Selecione</option>
                        <option>Informações</option>
                        <option>Suporte</option>
                        <option>Reclamação</option>
                    </select>


                    <label>Mensagem:</label>
                    <textarea placeholder="Escreva"></textarea>


                    <button type="submit">
                        Enviar Mensagem
                    </button>

                </form>


                <!-- MAPA -->
                <div class="mapa">
                    <span>Mapa</span>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
